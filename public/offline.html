<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Offline — Harf</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --surface: #141927;
      --gold: #c9a84c;
      --gold-muted: #a0813a;
      --text: #e8e0d0;
      --muted: #8a8070;
      --border: rgba(201, 168, 76, 0.18);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
    }

    .arabic {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 3rem;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 1.25rem;
      direction: rtl;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    button {
      background: var(--gold);
      color: var(--bg);
      border: none;
      border-radius: 0.5rem;
      padding: 0.65rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }
    button:active { opacity: 0.7; }

    .brand {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="arabic">حرف</div>
    <h1>You're offline</h1>
    <p>Check your connection and try again. Your study progress is safely stored on your device.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
  <div class="brand">حرف &mdash; Harf</div>
</body>
</html>
