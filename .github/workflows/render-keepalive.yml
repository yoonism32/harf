name: Render keep-alive

# Render's free web service stops after fifteen minutes without a request, so
# something has to ask the app for a response more often than that.
# GET /api/health answers from the app process and reads nothing from Supabase,
# so this keeps the service warm and reports whether it is actually serving.
# The database is handled separately by supabase-keepalive.yml.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Request the deployed health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/health
        env:
          HARF_BASE_URL: ${{ secrets.HARF_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HARF_BASE_URL}" ]; then
            echo "Set the HARF_BASE_URL repository secret, for example https://harf.onrender.com." >&2
            exit 1
          fi
          body=$(mktemp)
          # A cold start can take most of a minute, so the timeout is longer
          # than the Supabase job's and the retries cover a restart in progress.
          status=$(curl -sS --max-time 60 --retry 3 --retry-delay 15 --retry-all-errors \
            -o "$body" -w '%{http_code}' \
            "${HARF_BASE_URL%/}/api/health")
          echo "HTTP ${status}"
          cat "$body"
          echo
          if [ "$status" != "200" ]; then
            echo "Health check failed; the service may be down, restarting or moved." >&2
            exit 1
          fi
          if ! grep -q '"status":"ok"' "$body"; then
            echo "Unexpected health response." >&2
            exit 1
          fi
